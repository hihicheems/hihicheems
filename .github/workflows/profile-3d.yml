name: GitHub-Profile-3D-Contrib

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-3d.yml
      - settings.json
  schedule:
    - cron: "0 18 * * *" # Daily at 02:00 Asia/Shanghai.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Generate contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: settings.json

      - name: Commit and push generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-green-animate.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "generated: update profile 3d contrib"
            git push
          fi
